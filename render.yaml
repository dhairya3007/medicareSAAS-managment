services:
  - type: web
    name: medicare-saas
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >
      python manage.py migrate &&
      python manage.py shell -c "
      from django.contrib.auth.models import User;
      User.objects.filter(username='admin').exists() or
      User.objects.create_superuser('admin', 'admin@admin.com', 'admin9898')
      " &&
      gunicorn medical_shop.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        value: django-render-blueprint-p03h4vzr9ez6q0k7k0a3p2s2k-prod-2024-secure
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: medicare-saas.onrender.com,localhost
      - key: CSRF_TRUSTED_ORIGINS
        value: https://medicare-saas.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-saas-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0

databases:
  - name: medicare-saas-db
    databaseName: medicare_saas_prod
    region: oregon
    plan: free
    postgresMajorVersion: 16
