{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
.report-page {
    max-width: 700px;
    margin: 2rem auto;
    font-family: 'DM Sans', sans-serif;
}

.report-card {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 1.8rem;
    box-shadow: var(--shadow-sm);
}

.report-card h2 {
    margin-bottom: 0.5rem;
    font-weight: 700;
}

.report-card p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
}

.section {
    margin-bottom: 1.5rem;
}

.section h4 {
    margin-bottom: 0.6rem;
    font-size: 0.9rem;
    color: var(--text-muted);
}

.date-row {
    display: flex;
    gap: 10px;
    margin-bottom: 0.8rem;
}

.date-row input {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
}

.btn-primary {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
}

.btn-primary:hover {
    background: #065f46;
}

.quick-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn-outline {
    background: #fff;
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
}

.btn-outline:hover {
    background: var(--primary);
    color: #fff;
}

hr {
    margin: 1.5rem 0;
    border: none;
    border-top: 1px solid var(--border-color);
}
</style>

<div class="report-page">

    <div class="report-card">
        <h2>📊 Generate Sales Report</h2>
        <p>Select a time range to generate and download your report.</p>

        <form method="GET" action="{% url 'download_report' %}">

            <!-- Custom Range -->
            <div class="section">
                <h4>Custom Date Range</h4>

                <div class="date-row">
                    <input type="date" name="start_date" required>
                    <input type="date" name="end_date" required>
                </div>

                <button type="submit" class="btn-primary">
                    Download Custom Report
                </button>
            </div>

            <hr>

            <!-- Quick -->
            <div class="section">
                <h4>Quick Reports</h4>

                <div class="quick-buttons">
                    <button type="submit" name="months" value="1" class="btn-outline">
                        Last 1 Month
                    </button>
                    <button type="submit" name="months" value="2" class="btn-outline">
                        Last 2 Months
                    </button>
                    <button type="submit" name="months" value="3" class="btn-outline">
                        Last 3 Months
                    </button>
                </div>
            </div>

        </form>
    </div>

</div>

{% endblock %}
